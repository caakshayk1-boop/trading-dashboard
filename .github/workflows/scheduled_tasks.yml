name: Scheduled Tasks — CF Scans + Daily Brief

# Replaces Railway bot scheduler (Railway being shut down)
# IST = UTC+5:30
on:
  schedule:
    - cron: '30 0 * * *'      # 6:00 AM  IST — daily brief (every day)
    - cron: '45 1 * * *'      # 7:15 AM  IST — SIP bucket + price refresh
    - cron: '30 4 * * 1-5'    # 10:00 AM IST — CF scan (Mon–Fri only)
    - cron: '30 8 * * 1-5'    # 2:00 PM  IST — CF scan (Mon–Fri only)
    - cron: '30 12 * * 1-5'   # 6:00 PM  IST — CF scan (Mon–Fri only)
    - cron: '30 16 * * 1-5'   # 10:00 PM IST — CF scan (Mon–Fri only)
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run'
        required: false
        default: 'auto'
        type: choice
        options: [auto, daily_brief, cf_scan, sip_bucket]

concurrency:
  group: scheduled-tasks
  cancel-in-progress: false

permissions:
  contents: write    # needed to push data/daily_brief.json via GitHub API

env:
  TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
  TURSO_URL:           ${{ secrets.TURSO_URL }}
  TURSO_TOKEN:         ${{ secrets.TURSO_TOKEN }}
  GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
  GH_PAT:              ${{ secrets.GH_PAT }}               # PAT for obsidian-brain repo access
  OBSIDIAN_GITHUB_REPO: ${{ secrets.OBSIDIAN_GITHUB_REPO }}
  ADZUNA_APP_ID:       ${{ secrets.ADZUNA_APP_ID }}
  ADZUNA_APP_KEY:      ${{ secrets.ADZUNA_APP_KEY }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "yfinance>=0.2.40" pandas numpy ta requests pytz \
                      feedparser groq libsql-experimental python-dotenv

      # Task comes from the cron that fired, not from the wall clock. Reading
      # `date -u +%H` had the same failure as daily_scan.yml: GitHub delays
      # scheduled runs by hours, so the 00:30Z daily-brief cron arriving at
      # 02:10Z failed the `HOUR_UTC = 00` test and silently ran a CF scan
      # instead — the brief just never went out that day, with a green tick.
      - name: Detect task
        id: task
        env:
          INPUT: ${{ github.event.inputs.task }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$INPUT" ] && [ "$INPUT" != "auto" ]; then
            TASK="$INPUT"
          else
            case "$SCHEDULE" in
              "30 0 * * *") TASK=daily_brief ;;
              "45 1 * * *") TASK=sip_bucket  ;;
              *)            TASK=cf_scan     ;;
            esac
          fi
          echo "cron '$SCHEDULE' input '$INPUT' → task $TASK"
          echo "task=$TASK" >> $GITHUB_OUTPUT

      - name: Run daily brief
        if: steps.task.outputs.task == 'daily_brief'
        run: |
          python -c "
          from daily_brief import send_brief
          send_brief()
          print('Daily brief sent.')
          "

      - name: Run SIP bucket
        if: steps.task.outputs.task == 'sip_bucket'
        run: python scheduled_tasks_runner.py sip_bucket

      - name: Run CF scan
        if: steps.task.outputs.task == 'cf_scan'
        run: python scheduled_tasks_runner.py cf_scan
