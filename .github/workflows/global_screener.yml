name: Global 200WMA Monthly Screener

# Fires every Saturday 06:30 AM IST = Saturday 01:00 UTC.
# global_200ma_screener.py exits immediately unless it is the LAST Saturday
# of the month, so this runs once a month. The gate lives in Python because
# cron ORs day-of-month with day-of-week and so cannot express "last Saturday".
on:
  schedule:
    - cron: '0 1 * * 6'
  workflow_dispatch:

permissions:
  contents: write

env:
  TELEGRAM_TOKEN:  ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "yfinance>=0.2.40" pandas numpy requests

      - name: Run global 200WMA screener
        env:
          # Manual runs bypass the last-Saturday gate; scheduled runs respect it.
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python global_200ma_screener.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/global_200ma.json || true
          git diff --staged --quiet || git commit -m "data: global 200WMA scan $(date -u '+%Y-%m-%d') [skip ci]"
          git push || true
