name: Ledger Integrity — phantom exits + unresolvable closures

# Books a stop at the stop when the recorded exit price never actually traded
# during the trade. Turso is the source of truth, so this has to run here — a
# local --apply is overwritten by the next sync.
#
# regrade.py handles rows it can re-walk; this catches the residue it marks
# ungradeable, which is where HINDALCO's 990.00 survived.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write corrections (leave false for a dry run)'
        required: false
        default: 'false'

concurrency:
  group: ledger-writes
  cancel-in-progress: false

permissions:
  contents: write

env:
  TURSO_URL:   ${{ secrets.TURSO_URL }}
  TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
  GH_PAT:      ${{ secrets.GH_PAT }}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Order matters: reopen trades that were never resolved FIRST, so the
      # exit-price pass only ever looks at closures that really happened.
      - name: Verify closures (report)
        run: python verify_closures.py

      - name: Verify closures (apply)
        if: inputs.apply == 'true'
        run: python verify_closures.py --apply

      - name: Phantom exits (report)
        run: python fix_phantom_exits.py

      - name: Phantom exits (apply)
        if: inputs.apply == 'true'
        run: python fix_phantom_exits.py --apply

      # Last, so excursions are measured against outcomes that have already
      # been corrected by the two passes above.
      # Rule-vs-rule on the same bars, at each engine's own resolution.
      - name: Exit rule study
        run: python exit_rule_study.py

      - name: Excursions (report)
        run: python backfill_excursions.py

      - name: Excursions (apply)
        if: inputs.apply == 'true'
        run: python backfill_excursions.py --apply

      - name: Export refreshed feed
        if: inputs.apply == 'true'
        run: python -c "import tracker; tracker.export_signals_json()"

      - name: Commit refreshed feed
        if: inputs.apply == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/all_signals.json
          git diff --staged --quiet || git commit -m "chore: book phantom stop-outs at the stop"
          git push
