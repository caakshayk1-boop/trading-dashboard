name: Scheduled Tasks — Morning and Evening Briefs

# Replaces Railway bot scheduler (Railway being shut down)
# IST = UTC+5:30 · MYT = UTC+8:00. Market-hours tasks stay pinned to IST
# (NSE trades on IST regardless of where this runs); only the daily brief
# is pinned to MYT, since that's when the operator actually reads it.
# TWO Telegram sends a day. Nothing else in this workflow talks to Telegram.
#
# It used to be six crons, four of them CF scans that alerted on FX and
# commodity setups. The Rs 1 crore mandate is Indian listed equity only, so
# those scans were alerting on instruments the rulebook will not size — noise
# with a notification sound. They are removed rather than silenced, because a
# scan whose output nothing may act on is not worth the API calls.
#
# MORNING 08:00 MYT — before the Indian open (05:30 IST), and two hours after
#                     the newspaper build's own cron. What the book wants today
#                     and what the world did overnight, read over breakfast.
#                     This REPLACED the 12:30 MYT midday send rather than being
#                     added to it: two Telegram alerts a day means two.
# EVENING 20:00 MYT — NSE closed hours ago (17:30 IST) and the day's flows are
#                     published. What actually happened, plus the Life page's
#                     practice for the day. Moved from 17:00: at 20:00 the
#                     evening read is done and the FII/DII figures NSE posts
#                     after the close have actually landed.
#
# Why two hours and not ten minutes after the site build: GitHub delays
# scheduled runs by 1.5-3 hours and both jobs drift independently, so a small
# gap is a coin flip on whether the brief quotes today's page or yesterday's.
# The brief falls back to its local yfinance cache if it loses that race, so
# the failure is a staler markets line rather than a missing brief.
#
# Mon-Fri: a market brief on a Sunday is noise. Change `1-5` to `*` for daily.
on:
  schedule:
    # 06:43 UTC-previous-day, NOT 00:00. Two changes, both measured:
    #
    # 1. EARLIER, to absorb drift. GitHub's scheduler is best-effort and this
    #    repo runs 1.5-3h late. Observed: the 2026-08-26 morning brief was
    #    cron'd for 00:00 UTC and actually started 01:13 — 73 minutes late,
    #    so it landed at 09:13 MYT instead of 08:00.
    # 2. OFF-PEAK MINUTE. :00 of the hour is the single most contended slot on
    #    the whole platform; every scheduled workflow in the world asks for it.
    #    :43 queues far shorter.
    #
    # 22:43 UTC + ~75min observed drift ≈ 07:58 MYT. UTC Sun-Thu evening IS
    # MYT Mon-Fri morning, hence 0-4 rather than 1-5 — get that wrong and the
    # brief sends on Sunday and skips Friday.
    # ── REAL TIMES, NOT TIMES CHOSEN TO SURVIVE A GUESS ─────────────────────
    # These were '43 22 * * 0-4' and '43 10 * * 1-5': set ~75 minutes early so
    # that GitHub's observed drift would carry them to 08:00 and 20:00 MYT.
    #
    # Measured on 1 Sep 2026, that guess lost outright. The 22:43 UTC morning
    # cron produced NO RUN AT ALL; the brief reached Telegram at 14:14 MYT off
    # a catch-up, six hours late. The evening brief landed 23:09 MYT. Tuning
    # the guess cannot fix this, because the error is not a constant — it is a
    # queue, and sometimes it is a dropped run, where no offset helps.
    #
    # So the offset is gone. These now state the intended time honestly, and
    # PUNCTUALITY IS SOMEBODY ELSE'S JOB: src/watchdog.js on the Cloudflare
    # Worker ticks every 20 minutes, notices the slot passed unserved, and
    # dispatches the catch-up task — which stands down harmlessly if this cron
    # did fire. Cloudflare cron is an invocation of a running service, not a
    # queued job on a shared build fleet, and it keeps time.
    #
    # DAY-OF-WEEK CHANGED WITH THE HOUR, AND HAD TO. At 22:43 UTC the MYT day
    # was already tomorrow, so Mon-Fri MYT meant '0-4' in UTC. At 00:00 UTC the
    # two calendars agree and it is '1-5'. Carrying '0-4' across this edit
    # would have sent the brief on Sunday and skipped Friday.
    - cron: '0 0 * * 1-5'     # 08:00 MYT · morning brief
    - cron: '0 13 * * 1-5'    # 21:00 MYT · evening brief
    # CATCH-UP. Drift was never the whole story. On 2026-08-27 the 22:43 UTC
    # morning cron produced NO RUN AT ALL — not a late one, none — and the
    # brief went out only because it was dispatched by hand. GitHub's
    # scheduler is best-effort and silently DROPS runs under load, so a single
    # cron per slot means a brief that is missing rather than merely late, with
    # a green tick on the workflow because nothing ever started.
    #
    # These re-attempt the same slot ~2h and ~4h later. They are not duplicate
    # sends: send_brief(catch_up=True) checks job_runs for a delivery stamped
    # today in MYT and stands down when it finds one. On a normal day they cost
    # one Turso read each and post nothing.
    # Re-pointed to sit 2h and 4h after the slots ABOVE, not after the old
    # ones. A catch-up anchored to a slot that has moved is just a second
    # random time. The Worker watchdog now covers the first ~12 minutes, so
    # these are the deep backstop for a multi-hour GitHub outage.
    - cron: '0 2 * * 1-5'     # 10:00 MYT · morning catch-up (1st)
    - cron: '0 4 * * 1-5'     # 12:00 MYT · morning catch-up (2nd)
    - cron: '0 15 * * 1-5'    # 23:00 MYT · evening catch-up (1st)
    - cron: '0 17 * * 1-5'    # 01:00 MYT · evening catch-up (2nd)
    - cron: '45 1 * * *'      # 7:15 AM  IST — SIP bucket + price refresh (data only, no Telegram)
    # Health watch. The "Detect task" case below has routed '0 3,9,15 * * *'
    # to TASK=health since it was written, but that cron was never in this
    # list — so the arm was unreachable and the health watch only ever ran
    # by manual dispatch. Its own comment reads "Three times a day. Nothing
    # else watches production", and nothing did: every failure it was built
    # to catch is a 200 with a degraded body, which uptime pings miss.
    - cron: '0 3,9,15 * * *'  # 08:30 / 14:30 / 20:30 IST — health watch
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run'
        required: false
        default: 'auto'
        type: choice
        options: [auto, brief_morning, brief_morning_catchup, brief_midday, brief_evening, brief_evening_catchup, sip_bucket, ai_longterm, health, subscribers]

concurrency:
  group: scheduled-tasks
  cancel-in-progress: false

permissions:
  contents: write    # needed to push data/daily_brief.json via GitHub API

env:
  TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
  TURSO_URL:           ${{ secrets.TURSO_URL }}
  TURSO_TOKEN:         ${{ secrets.TURSO_TOKEN }}
  GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
  GH_PAT:              ${{ secrets.GH_PAT }}               # PAT for obsidian-brain repo access
  OBSIDIAN_GITHUB_REPO: ${{ secrets.OBSIDIAN_GITHUB_REPO }}
  ADZUNA_APP_ID:       ${{ secrets.ADZUNA_APP_ID }}
  ADZUNA_APP_KEY:      ${{ secrets.ADZUNA_APP_KEY }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "yfinance>=0.2.40" pandas numpy ta requests pytz \
                      feedparser groq libsql-experimental python-dotenv

      # Task comes from the cron that fired, not from the wall clock. Reading
      # `date -u +%H` had the same failure as daily_scan.yml: GitHub delays
      # scheduled runs by hours, so the 22:00Z daily-brief cron arriving late
      # failed an hour-equality test and silently ran a CF scan instead — the
      # brief just never went out that day, with a green tick.
      - name: Detect task
        id: task
        env:
          INPUT: ${{ github.event.inputs.task }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$INPUT" ] && [ "$INPUT" != "auto" ]; then
            TASK="$INPUT"
          else
            case "$SCHEDULE" in
              "43 22 * * 0-4")  TASK=brief_morning ;;
              # The old on-the-hour slots, kept so a manual dispatch of either
              # still resolves rather than falling through to TASK=none.
              "0 0 * * 1-5")    TASK=brief_morning ;;
              "0 13 * * 1-5")   TASK=brief_evening ;;
              "0 2 * * 1-5")    TASK=brief_morning_catchup ;;
              "0 4 * * 1-5")    TASK=brief_morning_catchup ;;
              "0 15 * * 1-5")   TASK=brief_evening_catchup ;;
              "0 17 * * 1-5")   TASK=brief_evening_catchup ;;
              # Kept so a manual dispatch of the old name still works.
              "30 4 * * 1-5")   TASK=brief_midday  ;;
              "43 10 * * 1-5")  TASK=brief_evening ;;
              "0 12 * * 1-5")   TASK=brief_evening ;;
              # The old 17:00 MYT slot, kept so a manual dispatch of it works.
              "0 9 * * 1-5")    TASK=brief_evening ;;
              # Catch-ups. Same slot, catch_up=True — see the schedule block.
              "17 1 * * 1-5")   TASK=brief_morning_catchup ;;
              "17 3 * * 1-5")   TASK=brief_morning_catchup ;;
              "17 13 * * 1-5")  TASK=brief_evening_catchup ;;
              "17 15 * * 1-5")  TASK=brief_evening_catchup ;;
              "45 1 * * *")     TASK=sip_bucket    ;;
              "0 3,9,15 * * *") TASK=health        ;;
              # No fallthrough to cf_scan any more. An unrecognised cron used to
              # become a CF scan, which is how a mis-typed schedule would have
              # quietly started alerting on commodities again.
              *)                TASK=none          ;;
            esac
          fi
          echo "cron '$SCHEDULE' input '$INPUT' → task $TASK"
          # How late was this? The whole reason the crons moved is that the
          # drift was invisible until someone noticed the brief arriving at the
          # wrong time. Printed every run so it is measurable, not folklore.
          echo "fired at $(date -u '+%H:%M UTC') / $(TZ=Asia/Kuala_Lumpur date '+%H:%M MYT')"
          echo "task=$TASK" >> $GITHUB_OUTPUT

      - name: Run morning brief
        if: steps.task.outputs.task == 'brief_morning'
        run: |
          python -c "
          from daily_brief import send_brief
          send_brief(slot='morning')
          print('Morning brief sent.')
          "

      - name: Run midday brief
        if: steps.task.outputs.task == 'brief_midday'
        run: |
          python -c "
          from daily_brief import send_brief
          send_brief(slot='midday')
          print('Midday brief sent.')
          "

      - name: Run evening brief
        if: steps.task.outputs.task == 'brief_evening'
        run: |
          python -c "
          from daily_brief import send_brief
          send_brief(slot='evening')
          print('Evening brief sent.')
          "

      # Catch-ups. These stand down on their own when the slot already went
      # out, so they are safe to run every weekday whether or not they are
      # needed. `continue-on-error` because a failed catch-up is not a failed
      # day — the primary send may well have succeeded hours ago, and a red
      # workflow there would train the eye to ignore red.
      - name: Morning brief catch-up
        if: steps.task.outputs.task == 'brief_morning_catchup'
        continue-on-error: true
        run: |
          python -c "
          import logging; logging.basicConfig(level=logging.INFO, format='%(levelname)s %(message)s')
          from daily_brief import send_brief, brief_already_sent, _brief_job
          from job_runs import latest
          before = latest(_brief_job('morning'))
          print('job_runs before:', before or 'NO RECORD')
          stood_down = brief_already_sent('morning')
          print('decision:', 'STAND DOWN' if stood_down else 'SEND')
          send_brief(slot='morning', catch_up=True)
          after = latest(_brief_job('morning'))
          print('job_runs after :', after or 'NO RECORD')
          "

      - name: Evening brief catch-up
        if: steps.task.outputs.task == 'brief_evening_catchup'
        continue-on-error: true
        run: |
          python -c "
          import logging; logging.basicConfig(level=logging.INFO, format='%(levelname)s %(message)s')
          from daily_brief import send_brief, brief_already_sent, _brief_job
          from job_runs import latest
          before = latest(_brief_job('evening'))
          print('job_runs before:', before or 'NO RECORD')
          stood_down = brief_already_sent('evening')
          print('decision:', 'STAND DOWN' if stood_down else 'SEND')
          send_brief(slot='evening', catch_up=True)
          after = latest(_brief_job('evening'))
          print('job_runs after :', after or 'NO RECORD')
          "

      - name: Run SIP bucket
        if: steps.task.outputs.task == 'sip_bucket'
        run: python scheduled_tasks_runner.py sip_bucket

      # On demand only. The Saturday scan runs this weekly; this exists so one
      # section can be populated without dispatching the whole weekend battery.
      - name: Run AI long-term screen
        if: steps.task.outputs.task == 'ai_longterm'
        run: python scheduled_tasks_runner.py ai_longterm

      # Three times a day. Nothing else watches production, and every failure
      # this week was a 200 with a degraded body — which uptime pings miss.
      - name: Health watch
        if: steps.task.outputs.task == 'health'
        run: python health_watch.py

      - name: Export subscribers
        if: steps.task.outputs.task == 'subscribers'
        run: python scheduled_tasks_runner.py subscribers

      - name: Run CF scan
        if: steps.task.outputs.task == 'cf_scan'
        run: python scheduled_tasks_runner.py cf_scan
