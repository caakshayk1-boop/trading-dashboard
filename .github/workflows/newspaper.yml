name: Daily Newspaper — Generate & Publish

on:
  schedule:
    - cron: "30 0 * * *"   # 6:00 AM IST (00:30 UTC)
  workflow_dispatch:         # manual trigger anytime

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate newspaper HTML
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OBSIDIAN_GITHUB_REPO: caakshayk1-boop/obsidian-brain
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: python generate.py

      - name: Commit & push docs/index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/alerts.json
          git diff --staged --quiet || git commit -m "chore: newspaper $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      # news.askakshay.com serves the Vercel deploy. Only the daily shell is
      # published here — signals, positions and stats are read live from Turso
      # by /api on every page load, so this does not need to run after a scan.
      - name: Deploy to Vercel (news.askakshay.com)
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        env:
          # VERCEL_ORG_ID / VERCEL_PROJECT_ID make the CLI target the existing
          # project without a checked-in .vercel directory.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p vercel-news/public
          cp docs/index.html  vercel-news/public/index.html
          cp docs/alerts.json vercel-news/public/alerts.json
          npx --yes vercel@latest deploy vercel-news --prod --yes --token "$VERCEL_TOKEN"
