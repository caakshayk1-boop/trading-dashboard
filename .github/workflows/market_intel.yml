name: Market Intel — daily corporate actions / FII-DII / sector heat

# Builds the market intel payload (NSE corporate actions, FII/DII net flow,
# sector heat) and caches it in Turso (newspaper_market_intel, keyed by
# date). The daily newspaper only READS that cache.
#
# Its own workflow for the same reason fund_screen.yml is separate from
# daily_scan.yml: NSE's endpoints are third-party calls that can hang or
# rate-limit, and that must never sit inside the 6 AM build and take the
# whole daily paper down with it.

on:
  schedule:
    # 01:30 IST Mon-Fri. newspaper.yml fires at 00:30 UTC, so this leaves a
    # 4.5h head start rather than the 90 minutes it had at 23:00 UTC.
    # Scheduled runs on this repo land 1.5-3h late (see
    # memory: project_gh_actions_cron_drift), which is WIDER than 90 minutes —
    # on 2026-08-17 this workflow finished 45 minutes after the paper had
    # already built and shipped, so the section rendered empty and was dropped
    # from the nav. generate.py now also builds this inline if the cache is
    # still empty at build time; the wider gap is what stops that being the
    # normal path.
    - cron: '0 20 * * 0-4'    # 01:30 IST Mon-Fri — 4.5h before newspaper.yml
  workflow_dispatch:

concurrency:
  group: market-intel
  cancel-in-progress: false

permissions:
  contents: write

env:
  TURSO_URL:   ${{ secrets.TURSO_URL }}
  TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and cache today's market intel
        run: |
          python - <<'PY'
          import json, logging
          logging.basicConfig(level=logging.INFO, format="%(message)s")
          import market_intel, newspaper
          from datetime import datetime

          JOB = "market_intel"
          try:
              data = market_intel.build()
              ca = len(data.get("corporate_actions", []))
              heat = len(data.get("market_heat", []))
              fd = data.get("fii_dii")
              print(f"corporate actions: {ca}")
              print(f"market heat: {heat} sectors")
              print(f"FII/DII: {fd}")

              # All three sources are independent — one being empty (e.g. NSE
              # hasn't published FII/DII yet) is real, not a failure. Only fail
              # loudly if EVERYTHING came back empty, which means the whole
              # fetch layer broke rather than one source having nothing today.
              if not (ca or heat or fd):
                  raise SystemExit("all three sources empty — fetch layer likely broken")

              today = datetime.now(newspaper.IST).strftime("%Y-%m-%d")
              with newspaper._db() as con:
                  con.execute("""CREATE TABLE IF NOT EXISTS newspaper_market_intel (
                      date TEXT PRIMARY KEY, payload TEXT)""")
                  con.execute("INSERT OR REPLACE INTO newspaper_market_intel VALUES (?,?)",
                              (today, json.dumps(data)))
                  con.commit()

              # Verify the write reached Turso, not just the local embedded
              # replica. A same-process "fresh" connection is NOT proof by
              # itself — every connect() here reuses the same local replica
              # file, so it would still see the write even if the push to
              # Turso failed (see stock_screen.yml for the incident this
              # exact gap caused). reset_replica() deletes the local file
              # first, so this connect() must pull genuinely fresh from Turso.
              newspaper._db_mod.reset_replica()
              with newspaper._db() as verify_con:
                  row = verify_con.execute(
                      "SELECT payload FROM newspaper_market_intel WHERE date=?", (today,)
                  ).fetchone()
              if not row or json.loads(row[0]).get("generated_at") != data.get("generated_at"):
                  raise SystemExit(
                      f"publish verification failed — {today} was written locally but "
                      f"does not read back correctly from Turso. Not safe to report "
                      f"success."
                  )
              print(f"\ncached for {today} — verified on Turso")
              newspaper.record_job_status(JOB, "success", f"{ca} actions, {heat} sectors")
          except BaseException as e:
              newspaper.record_job_status(JOB, "failed", str(e))
              raise
          PY
