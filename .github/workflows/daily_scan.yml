name: SwingDesk Pro — Auto Scan

# IST = UTC+5:30
# 09:20 IST = 03:50 UTC  → morning: 4H + AI + commodities
# 11:45 IST = 06:15 UTC  → midday: swing + F&O + 4H + AI + commodities
# 16:30 IST = 11:00 UTC  → EOD: breakouts + swing + AI daily + commodities
# 09:30 IST SAT = 04:00 UTC  → Saturday: full + multibaggers
# 10:00–14:30 IST (every 30 min) → intraday momentum tier
on:
  schedule:
    # 09:20 IST removed 2026-07-30 — it fired five minutes after the open,
    # before any position had moved enough for a price alert to mean anything,
    # and its signal scans were already stripped as unmeasured.
    - cron: '15 6 * * 1-5'       # 11:45 IST — midday position check (Mon-Fri)
    - cron: '0 11 * * 1-5'       # 16:30 IST — EOD + measured equity + ledger
    - cron: '0 4 * * 6'          # 09:30 IST — Saturday full + multibaggers
    #
    # The 30-minute intraday tier (10:00–14:30 IST, 9 runs/day) was removed on
    # 2026-07-30. It fired unmeasured signals and nothing ever established that
    # it had an edge. The closest thing we can measure — the 1H commodity
    # engine — backtested at -0.029R over 545 trades, while the daily-close
    # equity engine came in at +0.171R over 459 trades. Short intraday
    # horizons look like where the edge goes to die, so the burden of proof is
    # on re-adding it with a backtest, not on keeping it.
    #   python backtest.py --asset equity      # +0.171R
    #   python backtest.py --asset cf          # -0.029R
  workflow_dispatch:              # manual trigger from GitHub UI

concurrency:
  group: scanner
  cancel-in-progress: false       # never cancel — queue next run

env:
  TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
  UPSTOX_API_KEY:      ${{ secrets.UPSTOX_API_KEY }}
  UPSTOX_API_SECRET:   ${{ secrets.UPSTOX_API_SECRET }}
  TURSO_URL:           ${{ secrets.TURSO_URL }}
  TURSO_TOKEN:         ${{ secrets.TURSO_TOKEN }}
  GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
  GH_PAT:              ${{ secrets.GH_PAT }}
  OBSIDIAN_GITHUB_REPO: ${{ secrets.OBSIDIAN_GITHUB_REPO }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install core dependencies
        run: |
          pip install --upgrade pip
          pip install "yfinance>=0.2.40" pandas numpy ta requests pytz requests-cache multitasking python-dotenv

      - name: Install DB + optional dependencies
        run: |
          pip install libsql-experimental || true   # required by tracker.py → db.py
          pip install groq feedparser apscheduler || true
          pip install upstox-python-sdk || true

      - name: Ensure data directory exists
        run: mkdir -p data logs cache

      # Gate the scan on the alert pipeline being intact. A silent regression
      # here does not fail the run — it just stops signals reaching Telegram
      # while the site keeps showing them as sent, which is how 2026-07-31 went
      # unnoticed. Stubbed network, throwaway DB, runs in about a second.
      - name: Verify alert pipeline
        run: python test_alert_pipeline.py

      # Slot detection was removed with the intraday tier. It keyed off the
      # UTC minute and fell through to "intraday" on anything unrecognised —
      # so a cron delayed past its window (GitHub routinely runs several
      # minutes late) would silently run the wrong scanner. standalone_scan.py
      # derives its own slot from IST, which is the correct source anyway.
      - name: Run scanner
        run: python standalone_scan.py

      - name: Commit signal data to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/
          git diff --staged --quiet || git commit -m "data: update signals $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          git push || echo "Push failed — likely no changes or conflict"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-logs-${{ github.run_id }}
          path: |
            logs/
            data/
          retention-days: 7
