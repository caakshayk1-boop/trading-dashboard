# VISION LEGACY GRADING — the retired bottom-reversal and 4H-breakout engines.
#
# RETIRED 2026-10-01 (vision_scan.LEGACY, config vision-legacy-2.0.0). Neither
# rule files anything now. This job only grades the filings that were open at
# retirement, under the rules they were filed with, until each reaches its
# stop, T3 or horizon (30 sessions at most) — and keeps the whole history in
# feeds/vision_signals.json as the Legacy Archive Vision renders.
#
# ONE slot, after the close. The 07:58 UTC (13:28 IST) slot existed to read
# the morning 4H candle for NEW breakouts; with filing off it has nothing to
# do, so it is gone (and from the signal repo's watchdog). 10:15 UTC is
# 15:45 IST, after both 4H candles and the daily bar have closed, which is
# all grading needs. It fetches only the names with an open filing.
#
# The replacement, "Vision EOD — Risk-First Selection", runs in a private
# repository and publishes feeds/vision_eod.json here; it is NOT this job.
#
# SILENT. Nothing here sends a message.
name: vision-scan
on:
  # NO SCHEDULE — Vision legacy grading (bottom, brk4h) retired at the Signal V2 cutover, 2026-10-01
  # (v1_cutover.py). The old crons are in git history at the cutover commit.
  workflow_dispatch:

permissions:
  contents: write

# One harvest at a time against Yahoo, and one writer of the feed. Queued, not
# cancelled: an interrupted run leaves the feed as it was.
concurrency:
  group: vision-scan
  cancel-in-progress: false

# PLACEHOLDERS, NOT SECRETS. Importing scanner imports config.py, which raises
# on a missing variable. Nothing in this workflow sends or authenticates.
env:
  TELEGRAM_TOKEN: placeholder-not-a-secret
  TELEGRAM_CHAT_ID: placeholder-not-a-secret
  GROQ_API_KEY: placeholder-not-a-secret

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install numpy pandas ta requests "yfinance>=0.2.40"

      # The rules' own tests first: a scan that files levels from a broken rule
      # is worse than no scan.
      - name: Test the rules
        run: python3 test_vision_signals.py

      - name: Grade the open legacy filings
        run: python3 vision_scan.py

      - name: Commit the feed
        run: |
          git config user.name  "vision-scan"
          git config user.email "actions@github.com"
          git add feeds/vision_signals.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: vision legacy grading $(date -u +%F\ %H:%M) [skip ci]"
          # Other jobs push to main on their own clocks; rebase onto them
          # rather than failing the run over a race nobody can see.
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase origin main || exit 1
            sleep $((i * 3))
          done
          exit 1
