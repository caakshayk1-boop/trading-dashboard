name: Stock Screen — weekly NSE Total Market research screen

# Builds the NSE Total Market (750 names) research screen and caches it in Turso
# (newspaper_screen, keyed by ISO week). The daily newspaper only READS that
# cache and writes docs/screen.json from it.
#
# Its own workflow for the same reason fund_screen.yml has one: this is ~750
# symbols × (one quote + two statement frames), fetched sequentially because
# Yahoo throttles an IP that bursts. That is roughly 29 minutes on a cold cache
# and it does not belong anywhere near the 6 AM job's 15-minute budget.
#
# Runs AFTER the fund screen (01:30 IST) rather than alongside it — two jobs
# hammering Yahoo from the same runner IP is how both end up rate-limited.

on:
  schedule:
    # DAILY as of 2026-08-27, not Sunday-only.
    #
    # The screen carries two kinds of column and they age at completely
    # different rates. Fundamentals — ROCE, three-year compounding, leverage —
    # come from annual filings and genuinely do not move in a week. Price, RSI,
    # turnover and vol_spike move every session, and TWO published sections are
    # built entirely from them: the volume board ("Who actually showed up") and
    # the breakout table ("Breaking out, and liquid enough to leave").
    #
    # On a Sunday cadence both spent the week describing last Friday while
    # reading as today: on 2026-08-27 the volume board was showing 08-21
    # volumes under a heading that says "names trading at twice their own
    # average volume". That is not staleness, it is a wrong answer.
    #
    # Cost measured, not assumed: the last full 750-name run took 10m27s. Daily
    # is ~315 minutes a month. Re-reading unchanged fundamentals every day is
    # waste, but it is cheap waste and far less risky than splitting the
    # payload into two clocks that can disagree with each other.
    - cron: '0 21 * * *'      # 02:30 IST daily — after the fund screen
    # And a retry, because GitHub drops scheduled runs outright — it dropped
    # three of this repo's workflows on 2026-08-27 alone.
    - cron: '0 1 * * *'       # 06:30 IST — retry if the 02:30 run was dropped
  workflow_dispatch:
    inputs:
      limit:
        description: 'Cap the universe (blank = all ~750; use 50 for a smoke run)'
        required: false
        default: ''
      news_top:
        description: 'Fetch headlines for the top N by composite'
        required: false
        default: '150'

concurrency:
  group: stock-screen
  cancel-in-progress: false

permissions:
  contents: write

env:
  TURSO_URL:   ${{ secrets.TURSO_URL }}
  TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
  # Optional. Absent means the narrative layer is skipped and every row keeps
  # its rule-based SWOT — the section does not depend on this key.
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  screen:
    runs-on: ubuntu-latest
    # Generous on purpose, like the fund screen: this is a job that is ALLOWED
    # to be slow. A cold statements cache is the long case; a warm one (30-day
    # TTL) finishes in a couple of minutes.
    # 750 symbols on a COLD statements cache is ~29 min of sequential fetches
    # (500 took 19.4 min measured), plus prices, 150 news calls and a paced
    # narrative pass. That lands near 35 min, so 45 was too close to the edge
    # once the universe widened from 500. A warm cache finishes in minutes.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The statements cache is the whole reason this job is usually fast.
      # Restoring it across runs means a weekly build re-fetches only what has
      # aged past the 30-day TTL instead of all 750 symbols every Sunday.
      - name: Restore fundamentals caches
        uses: actions/cache@v4
        with:
          path: |
            cache/fundamentals.json
            cache/statements.json
          key: fundamentals-${{ github.run_id }}
          restore-keys: |
            fundamentals-

      - name: Build and cache the screen
        env:
          SCREEN_LIMIT: ${{ inputs.limit }}
          NEWS_TOP: ${{ inputs.news_top || '150' }}
        run: |
          python - <<'PY'
          import os, json, logging
          logging.basicConfig(level=logging.INFO, format="%(message)s")
          import stock_screen, newspaper

          JOB = "stock_screen"
          # Initialised before the try, not inside it. An exception raised
          # before the build — a bad SCREEN_LIMIT, an import failure — would
          # otherwise hit NameError inside the failure handler and lose the
          # failure record itself, which is the one thing that must survive.
          attempt_records = attempt_expected = None
          try:
              limit = int(os.environ.get("SCREEN_LIMIT") or 0) or None
              news = int(os.environ.get("NEWS_TOP") or 150)
              # Narrative is injected, not imported — no key means no prose and
              # every row still carries its rule-based SWOT.
              ai = newspaper.groq_complete if newspaper.GROQ_KEY else None
              # Previous build for the delta columns.
              prev = None
              try:
                  with newspaper._db() as con:
                      row = con.execute("SELECT payload FROM newspaper_screen "
                                        "ORDER BY week DESC LIMIT 1").fetchone()
                  if row:
                      prev = json.loads(row[0])
                      print(f"diffing against the build of {prev.get('built_on')}")
              except Exception as e:
                  print(f"no previous build to diff against: {e}")
              data = stock_screen.build(limit=limit, news_top=news, ai=ai, prev=prev)
              if not data.get("ok"):
                  raise SystemExit(f"screen failed: {data.get('error')}")

              cov = data["coverage"]
              # Held outside the try/except so a REFUSED publish can still say
              # how much it managed to price. Without this the site could only
              # report the served dataset's size, which is how a 750-row table
              # ended up sitting above a "only 50 companies priced" warning
              # with nothing tying the two numbers together (audit 2026-08-18).
              attempt_records, attempt_expected = data["count"], data["attempted"]
              print(f"\n{data['count']} companies of {data['attempted']} attempted "
                    f"in {data['build_secs']}s")
              print(f"  statements  {cov['statements']:3} ({cov['statements_pct']}%)")
              print(f"  ROCE        {cov['roce']:3} ({cov['roce_pct']}%)")
              print(f"  prices to   {data['price_date']}")
              print("\ntop 10 by composite:")
              for r in data["rows"][:10]:
                  print(f"  {r['sym']:<12} comp {r.get('comp')}  Q {r.get('q')}  "
                        f"G {r.get('g')}  V {r.get('v')}  T {r.get('tech')}  "
                        f"ROCE {r.get('roce')}")

              # Coverage floors. A run that technically succeeds while Yahoo returns
              # nothing would cache a price-only screen with every ratio column
              # blank, and the section would render for a week looking like the
              # accounts simply do not exist. Fail instead — the reader keeps last
              # week's screen, which is stamped with its own date.
              # Floor scaled with the universe: 750 names, so 450 is the same
              # 60% bar the 500-name screen had at 300.
              if data["count"] < 450:
                  raise SystemExit(f"only {data['count']} companies priced — refusing to cache")
              if cov["statements_pct"] < 70:
                  raise SystemExit(f"statements for only {cov['statements_pct']}% — refusing to cache")

              week = newspaper._stock_week_key()
              with newspaper._db() as con:
                  con.execute("""CREATE TABLE IF NOT EXISTS newspaper_screen (
                      week TEXT PRIMARY KEY, payload TEXT)""")
                  con.execute("INSERT OR REPLACE INTO newspaper_screen VALUES (?,?)",
                              (week, json.dumps(data)))
                  con.commit()

              # Verify the write actually reached Turso, not just the local
              # embedded replica. On 2026-08-15 this exact job built a fresh
              # screen (BLS top-5, prices to 2026-08-14), printed "cached", and
              # exited 0 — but the remote DB never got it and the site kept
              # serving 2026-08-12 for 5 days with no error anywhere.
              #
              # A same-process "fresh" connection is NOT a real check: every
              # connect() in this job reuses the same local replica file, so
              # it would still see the write even if the push to Turso failed
              # (confirmed 2026-08-17 — that exact check passed here and the
              # live site still served 2026-08-12 afterward). reset_replica()
              # deletes the local file first, so this connect() has nothing
              # to fall back on but a genuine pull from Turso.
              newspaper._db_mod.reset_replica()
              with newspaper._db() as verify_con:
                  row = verify_con.execute(
                      "SELECT payload FROM newspaper_screen WHERE week=?", (week,)
                  ).fetchone()
              if not row or json.loads(row[0]).get("generated_at") != data.get("generated_at"):
                  raise SystemExit(
                      f"publish verification failed — week {week} was written locally "
                      f"but does not read back correctly from Turso. The remote DB "
                      f"still has last week's build. Not safe to report success."
                  )
              print(f"\ncached for week {week} — verified on Turso")
              newspaper.record_job_status(JOB, "success", f"week {week}, {data['count']} companies",
                                          records=attempt_records, expected=attempt_expected)
          except BaseException as e:
              # Recorded even for a SystemExit floor-trip, not just an unhandled
              # crash — a refused publish ("only 200 companies priced") is exactly
              # the kind of failure the site should be able to say "last attempt
              # failed, N hours ago" about, not just silently keep last week's data.
              newspaper.record_job_status(JOB, "failed", str(e),
                                          records=attempt_records, expected=attempt_expected)
              raise
          PY

      # NO commit step for the caches, deliberately. There was one and it could
      # never have worked: cache/ is gitignored, so `git add cache/*.json` errored
      # into its own `|| true` and printed "caches unchanged" on every run — dead
      # machinery that looked like a working safety net. They are also the wrong
      # size to commit daily (fundamentals 660KB, statements 1.6MB).
      #
      # actions/cache above IS the persistence, and it is enough: the statements
      # TTL is 30 days, so a warm restore turns a ~11-minute cold build into
      # about two minutes. cache/nifty500.csv is the one file here that IS
      # committed, because it is an input rather than a cache — see .gitignore.
