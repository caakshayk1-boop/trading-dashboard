# BUOY — the forward scan for an UNPROVEN engine.
#
# It exists to grow a sample, not to publish trades. BUOY measures near zero on
# both of its lanes; neither is distinguishable from zero. Running it in the
# open is how that gets settled one way or the other.
#
# THE NUMBERS ARE NOT REPEATED HERE. They live in BACKTEST in signals/buoy.py
# and nowhere else. This comment used to quote "+0.074R at t=+0.23 over 18 ...
# +0.065R at t=+0.77 over 217" from an earlier sweep, and went on saying it
# after the production harness measured n=35 and n=348 — a comment describing a
# workflow by numbers the workflow no longer produces.
#
# TWICE A DAY, AT THE 4-HOUR CLOSES — not hourly.
#
# The engine reads 4H candles, and an NSE session makes exactly two: 09:15-13:15
# and 13:15-15:30 IST. Scanning at any other time asks the rule about a candle
# that has not finished forming, which is the one thing a close-based rule
# cannot answer. 07:50 and 10:05 UTC are 13:20 and 15:35 IST — a few minutes
# after each candle closes, so the bar Yahoo returns is complete.
#
# The earlier hourly cron was left over from the hourly build and would have
# run seven times a day to re-answer a question that changes twice.
name: research-scan
on:
  schedule:
    - cron: "50 7 * * 1-5"
    - cron: "5 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

# TWO HARVESTS MUST NEVER OVERLAP, AND ON 2026-09-09 TWO DID.
#
# A push to main and a manual dispatch started a minute apart and both began
# fetching the same 500 symbols. That is six concurrent workers against Yahoo,
# not three — past the four-way concurrency scan_buoy.py measured earns this
# address a ten-minute 429. The pacing inside harvest_bars.py is careful and
# it can only govern ONE process; nothing was stopping a second.
#
# It also races on the commit at the end: both runs write the same three files
# and push.
#
# Queued rather than cancelled, because a half-finished harvest leaves the
# cache untouched (bars_cache writes through a temp file) and the second run
# then does the work properly rather than being dropped.
concurrency:
  group: research-scan
  cancel-in-progress: false

# PLACEHOLDERS, NOT SECRETS, AND THEY MUST STAY THAT WAY.
#
# The harvest resolves each ticker's frame with scanner._own_frame — the one
# function that knows how to pull a symbol out of yfinance's MultiIndex
# without handing back a neighbour's column. Importing scanner imports
# config.py, which raises at import time on a missing variable, so these three
# have to be set to something.
#
# Nothing in this workflow sends, fetches or authenticates against any of them.
# The alternative was a second copy of _own_frame living here, and two
# implementations of "which column belongs to this ticker" is precisely how a
# scan comes to publish one company's price under another's name.
env:
  TELEGRAM_TOKEN: placeholder-not-a-secret
  TELEGRAM_CHAT_ID: placeholder-not-a-secret
  GROQ_API_KEY: placeholder-not-a-secret

jobs:
  scan:
    runs-on: ubuntu-latest
    # MEASURED, NOT ESTIMATED. The first live run was cancelled at exactly 30
    # minutes mid-harvest: 500 symbols over two ranges is ~1000 paced calls,
    # and the estimate of 4-5 minutes that set this cap was wrong by roughly an
    # order of magnitude. Raised with room, and harvest_bars.py now logs
    # progress every 25 symbols so a slow or throttled run is visible while it
    # is happening rather than only in what it failed to produce.
    #
    # Free on a public repo. If the real cost turns out worse than this,
    # RESEARCH_UNIVERSE_LIMIT narrows the universe without a code change —
    # scan_research.py publishes a `scanned` count per engine precisely so a
    # narrower run is a visible outcome rather than a silent one.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # numpy ALONE WAS NOT ENOUGH, AND THIS WORKFLOW HAD NEVER ONCE RUN.
      #
      # scan_research.py imports signals/, whose __init__ pulls
      # signals.indicators, which imports `ta` at module load. Every scheduled
      # run since this file was written died on ModuleNotFoundError before
      # reaching a single line of scan code — so docs/research.json,
      # docs/alerts_log.json and docs/buoy.json have only ever been whatever
      # was committed by hand, and the research floor on the site was never
      # actually being measured twice a day the way this file says it is.
      #
      # The full chain: numpy and pandas (frames), ta (the ATR and RSI the
      # engines read), requests (signals/universe.py pulls the NSE index CSVs),
      # and yfinance — which the harvest now uses instead of raw urllib.
      #
      # A RAW GET IS REFUSED FROM A RUNNER. Measured 2026-09-09: the urllib
      # version returned nothing for 500 of 500 symbols over 35 minutes, while
      # ninety minutes earlier on the same infrastructure standalone_scan
      # fetched 113 tickers through yfinance in about four seconds. Yahoo was
      # not blocking the runner; it was refusing a request without the
      # cookie-and-crumb handshake yfinance performs.
      - run: pip install numpy pandas ta requests "yfinance>=0.2.40"

      # THE BARS HAD NO PRODUCER. This is it.
      #
      # scan_research.py reads barsH.json and barsD3y.json. Five files read
      # them and nothing in the repository has ever written them — they were
      # harvested by hand into a scratch folder on one Mac, so this workflow
      # could not have worked anywhere else even once the import error above
      # was fixed. harvest_bars.py fills the cache; bars_cache.py says where.
      #
      # Paced at the values scan_buoy.py measured: three workers over Yahoo's
      # two hosts, a quarter second apart. Four-way concurrency earned this
      # address a ten-minute 429; three has not.
      #
      # A partial harvest is NOT a failure. Symbols that 404 or come back
      # short are counted in the manifest and the scan publishes the coverage,
      # so a narrower run is never mistaken for the full universe. The step
      # fails only if the harvest comes back completely empty, which means
      # the fetch is broken rather than the market being quiet.
      - name: Harvest the bars the engines read
        run: python3 harvest_bars.py

      - name: Scan the 750 with every research engine
        run: python3 scan_research.py
      - name: Commit the scan
        run: |
          git config user.name  "buoy-scan"
          git config user.email "actions@github.com"
          # docs/buoy.json IS NOT LISTED, BECAUSE THIS JOB DOES NOT WRITE IT.
          #
          # scan_buoy.py writes it; this job runs scan_research.py, which
          # covers BUOY alongside the other two. So the file was staged on
          # every run and never differed — a workflow implying it produces an
          # artefact it has not touched since 2026-09-08. The site does not
          # read it either: /buoy redirects to /research.
          git add docs/research.json docs/alerts_log.json
          git diff --staged --quiet || git commit -m "chore: research scan $(date -u +%F\ %H:%M)"
          git push
