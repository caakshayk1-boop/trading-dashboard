name: Daily Newspaper — Generate & Publish

on:
  schedule:
    - cron: "0 22 * * *"   # 6:00 AM MYT (22:00 UTC prev day) — site is operated from Malaysia
  workflow_dispatch:         # manual trigger anytime

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The learning banks are hand-authored tuples; a dropped field only
      # surfaces at render time. Fail here instead.
      - name: Validate daily learning banks
        run: python daily_learning.py > /dev/null

      # Possible only since app.js became a real file. While it was a string
      # inside newspaper.py nothing could parse it, and a syntax error shipped
      # straight to production — where it aborts the whole script block and
      # takes every interactive feature with it. Blocking on purpose: this is
      # correctness, not style.
      # Every case in here shipped to production once. Verified to FAIL when
      # the defect is reintroduced — a regression test that has never failed is
      # not evidence of anything.
      - name: Engine regressions
        run: python test_engine_regressions.py

      # Everything below guards a number the page PUBLISHES, so each one runs
      # before the paper is built rather than on its own schedule. A suite that
      # only runs when someone remembers is not a gate.
      - name: Page structure, data health, symbols and SIP maths
        run: |
          python test_page_structure.py
          python test_data_health.py
          python test_symbols.py
          python test_sip_engine.py
          python test_ipo_tracker.py
          python test_signal_history.py
          python test_smart_reads.py
          python test_fscore.py
          python test_insights.py

      - name: Lint the page script
        run: |
          node --check static/app.js
          npx --yes eslint@9 static/app.js

      # Pure ladder/P&L logic for the position tracker — no Turso connection
      # needed, _positions.js has zero external imports, so this runs without
      # an npm install. Catches a broken 30%/50% milestone or a LONG/SHORT
      # sign flip before it reaches the live book instead of after.
      - name: Position tracker tests
        run: cd vercel-news && node --test

      # The SWP drawdown engine, extracted from the shipped static/app.js so
      # it cannot pass against a copy that has drifted from what the page runs.
      - name: SWP edge cases
        run: node --test test_swp.mjs test_compare.mjs

      # Installed before generate so BOTH the pre-publish gate and the
      # post-deploy check can use it. smoke_runner.cjs is Node, not Python —
      # `pip install playwright` gets you a package the runner cannot import.
      # Chromium is ~130MB and this step stalled past the job's 15-minute cap
      # twice on 2026-08-19, taking two otherwise-green builds with it. Every
      # test had already passed; the download is simply the slowest thing here.
      #
      # Cached on the playwright version, so a hit skips the download entirely
      # and a miss still works. --with-deps stays OUTSIDE the cache: the apt
      # libraries it installs live in the runner image, not in ~/.cache.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}
          restore-keys: playwright-chromium-

      - name: Install Playwright (node)
        timeout-minutes: 6
        run: |
          npm i -D playwright --no-audit --no-fund
          # A retry rather than a hard fail: this is a network download, and
          # losing a whole newspaper build to one slow CDN response is worse
          # than spending 30 seconds trying again.
          npx playwright install chromium --with-deps \
            || (echo "retrying playwright install" && sleep 20 && npx playwright install chromium --with-deps)

      - name: Generate newspaper HTML
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Read by exactly one function, sync_tracker_to_obsidian, which writes
          # into the obsidian-brain repo. generate.py never calls it — that
          # function is reachable only from the Flask route POST /tracker/obsidian —
          # so this is currently unused. It is wired to GH_PAT rather than the
          # built-in secrets.GITHUB_TOKEN because the built-in token is scoped to
          # this repo alone and could never reach obsidian-brain: the day anything
          # does call that function from CI, it would have failed silently.
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          OBSIDIAN_GITHUB_REPO: caakshayk1-boop/obsidian-brain
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
          # IPO Radar's enrichment needs no key. NSE publishes band, size, dates
          # and subscription but not lot size, minimum application, the
          # fresh/OFS split or GMP; those come from Chittorgarh and
          # investorgain through crawler.py — Jina Reader first, Crawl4AI if
          # installed, then a direct fetch. No paid provider is involved.
        run: python generate.py

      # THE GATE. Serve the freshly generated docs/ locally and check it before
      # anything is committed. The full smoke test still runs after deploy, but
      # by then a failure only reports that the broken page is already public —
      # which is exactly what happened on 2026-08-08.
      - name: Pre-publish check (nothing is committed yet)
        run: |
          python -m http.server 4321 --directory docs > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:4321/ > /dev/null && break; sleep 0.5; done
          python smoke_test.py http://127.0.0.1:4321 --pre

      # data/ipo_radar.json is committed alongside docs/ on purpose. It is the
      # ONLY persistent record of the enriched IPO fields — lot size, minimum
      # application, anchor book, GMP, financials — which are fetched in CI and
      # otherwise die with the runner. ipo_radar.enrich() carries the previous
      # values forward when a fetch fails, and that carry-forward reads this
      # file: without it there is nothing to carry, so the first Firecrawl
      # outage silently strips every enriched field from the page. Which is
      # exactly what happened the first time the account hit its credit limit.
      - name: Commit & push docs/index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # FOURTH allow-list for a docs/ file. To reach production it must be
          # written by generate.py, added here, named in .vercelignore AND
          # copied by vercel-news/build.js. today.json had three of the four
          # and 404'd; the build log said it was written, which made it look
          # like anything but a missing filename.
          # screen.json / screen-detail.json were the fourth-allow-list bug in
          # its other direction: written by generate.py every build, named in
          # .vercelignore, copied by build.js — and never added HERE, so the
          # runner rebuilt them, `git pull --rebase --autostash` stashed and
          # restored them, and the runner was then destroyed with the fresh
          # file still uncommitted. Production therefore served whatever a
          # human had last committed by hand. On 2026-08-17 that was a payload
          # built on 2026-08-12, which predated the Piotroski field, so the
          # F-Score column was populated in the server-rendered top 25 and
          # empty for all 750 rows the moment the table lazy-loaded.
          # docs/desk.html removed 2026-09-03 — the Life page moved to
          # career.askakshay.com and generate.py no longer writes the file. A
          # `git add` naming a path that does not exist is a fatal error, not a
          # warning, and it fails the whole publish AFTER the page built fine.
          git add docs/index.html docs/alerts.json docs/edition.json \
                  docs/today.json docs/mandate.json docs/app.js docs/data-health.json \
                  docs/v2-core.js \
                  docs/life.html docs/life.js \
                  docs/next.html docs/next.css docs/next.js \
                  docs/pulse.json docs/ipo.json docs/news.json \
                  docs/conviction.json data/conviction_log.json \
                  docs/screen.json docs/screen-detail.json \
                  docs/robots.txt docs/sitemap.xml docs/manifest.webmanifest \
                  docs/icon.svg docs/og.png docs/share.png docs/fonts \
                  data/ipo_radar.json
          git diff --staged --quiet || git commit -m "chore: newspaper $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Rebase before pushing. This step raced the scanner's data commit and
          # any hand push, and a losing race failed the whole run — meaning the
          # page silently did not rebuild that day. Only generated files are
          # touched here, so a rebase can never conflict with source changes.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $i lost a race — retrying"
            sleep 5
          done
          echo "::error::could not push docs/ after 3 attempts"
          exit 1

      # The page a browser renders, checked after it is live. Everything above
      # validates Python and JSON; nothing validated that the page still works
      # — which is how a one-line selector change took the whole site down with
      # a green build. Runs against production because that is what users get.
      - name: Wait for deploy
        run: sleep 75

      - name: Smoke test the rendered page
        run: python smoke_test.py https://news.askakshay.com

      # smoke_test.py covers the broadsheet. /next.html is a second surface
      # with an interactive markets board and a trading brief whose widgets are
      # all JavaScript — a broken slider or a dead tooltip leaves a page that
      # still looks finished. Runs against production for the same reason the
      # step above does: that is what a reader gets.
      - name: Check /next.html's interactive layer
        run: node test_next_ui.mjs https://news.askakshay.com

      # No deploy step here on purpose. The Vercel project vercel-news is
      # connected to this repository, so the push above is what ships the site.
      # A CLI deploy would publish the same commit a second time.
      #
      # Only the daily shell is published this way — signals, positions and
      # stats are read live from Turso by /api on every page load, which is why
      # nothing needs to redeploy after a scan.
