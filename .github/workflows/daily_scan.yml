name: SwingDesk Pro — Auto Scan

# IST = UTC+5:30
# 09:20 IST = 03:50 UTC  → morning: 4H + AI + commodities
# 10:30 IST = 05:00 UTC  → midday: swing + F&O + 4H + AI + commodities
# 16:30 IST = 11:00 UTC  → EOD: breakouts + swing + AI daily + commodities
# 09:30 IST SAT = 04:00 UTC  → Saturday: full + multibaggers
# 10:00–14:30 IST (every 30 min) → intraday momentum tier
on:
  schedule:
    # 09:20 IST removed 2026-07-30 — it fired five minutes after the open,
    # before any position had moved enough for a price alert to mean anything,
    # and its signal scans were already stripped as unmeasured.
    # ── Scheduled EARLY so worst-case drift still leaves time to execute. ──
    # NSE trades 09:15–15:30 IST and scheduled runs on this repo land 1.5–3h
    # late (memory: project_gh_actions_cron_drift). The midday slot used to be
    # cron'd at 11:45 IST, which on a bad day surfaces at 14:45 with 45 minutes
    # of session left — and this is the ONLY actionable in-hours scan, so when
    # it lands late there is no second chance that day.
    #
    # 10:30 IST leaves a 5h buffer to the close: even a full 3h drift surfaces
    # signals by 13:30, two hours before the bell.
    #
    # NOTE: this MOVES the existing slot, it does not add scans. The 30-minute
    # intraday tier was removed on 2026-07-30 for a measured reason (see below)
    # and re-adding actionable slots needs a backtest, not a schedule edit.
    # ── THE TWO SLOTS THE OPERATOR ASKED FOR, IN HIS CLOCK ──────────────────
    # "signals - opening 1pm MYT, closing 9pm MYT with all updates".
    # MYT is UTC+8, so 13:00 MYT = 05:00 UTC and 21:00 MYT = 13:00 UTC.
    #
    # These are now the REAL times, not times chosen to land near the target
    # after an assumed delay. The previous schedule set crons 75 minutes early
    # and hoped GitHub's drift made up the difference; when the drift was 6
    # hours, or the run was dropped outright, the guess simply lost. Punctuality
    # is now the Cloudflare watchdog's job (src/watchdog.js in the signal repo):
    # it ticks every 20 minutes, sees the slot pass unserved, and dispatches.
    # These crons are attempt one, not the mechanism.
    - cron: '0 5 * * 1-5'        # 13:00 MYT / 10:30 IST — signals OPEN
    - cron: '0 13 * * 1-5'       # 21:00 MYT / 18:30 IST — signals CLOSE,
                                 # measured equity + ledger settlement. Three
                                 # hours after the bell, so every close is
                                 # final: measurement, not tradeable alerts.
    - cron: '0 4 * * 6'          # 09:30 IST — Saturday full + multibaggers
    # US positions, graded after the US close and delivered in the IST morning.
    #
    # Before this, US names were graded by the 16:30 IST end-of-day slot: on
    # 2026-08-19 "SL HIT — SMCI" arrived at 16:41 IST, 14 hours after the US
    # close and two hours before the next US open. The grading was right; the
    # timing made it unreadable.
    #
    # 03:00 UTC = 08:30 IST, Tue-Sat so it covers Mon-Fri US sessions. The US
    # close is 20:00 UTC (summer) / 21:00 UTC (winter), so even 3h of the cron
    # drift this repo sees still lands well after it.
    # US SLOT RETIRED 2026-08-27, on the operator's instruction: "us session we
    # dont need". The Rs 1 crore mandate is Indian listed equity only, so a US
    # position check alerts on instruments the rulebook will not size. The arm
    # below is kept so a manual dispatch of `us` still works for anyone holding
    # legacy US rows — the schedule is gone, the capability is not.
    #
    # CATCH-UPS. GitHub's scheduler DROPS runs, it does not merely delay them:
    # on 2026-08-27 neither the 03:00 nor the 05:00 cron produced a run at all,
    # and the workflow list simply skips from 08-26T11:16Z to nothing. A green
    # history with a missing day looks identical to a quiet day.
    #
    # These re-attempt the two slots that matter ~2h and ~4h later. They are
    # not double scans: --catch-up stands down when job_runs already carries a
    # completed run for that slot on that IST date.
    # The midday retries sit at 11:00 and 11:30 IST, NOT the 12:30/14:30 that
    # looked more generous. test_engine_regressions enforces
    # cron_IST + 3h drift <= 14:30, an hour before the bell, and 12:30 IST
    # fails it: worst case it surfaces AT 15:30, the close. A retry that can
    # only arrive after the market shuts is not a retry, it is a log entry.
    # 06:00 UTC is the last actionable weekday slot on this repo, full stop.
    - cron: '30 5 * * 1-5'       # 11:00 IST — midday retry (1st)
    - cron: '0 6 * * 1-5'        # 11:30 IST — midday retry (2nd, the last one
                                 # that can still clear the drift rule)
    # EOD is measurement, not execution, so its retries may sit late. The old
    # first retry was 13:00 UTC, which is now the primary slot itself — keeping
    # it would have been a duplicate cron for the same minute.
    - cron: '0 15 * * 1-5'       # 23:00 MYT / 20:30 IST — EOD retry (1st)
    - cron: '0 17 * * 1-5'       # 01:00 MYT / 22:30 IST — EOD retry (2nd)
    #
    # The 30-minute intraday tier (10:00–14:30 IST, 9 runs/day) was removed on
    # 2026-07-30. It fired unmeasured signals and nothing ever established that
    # it had an edge. The closest thing we can measure — the 1H commodity
    # engine — backtested at -0.029R over 545 trades, while the daily-close
    # equity engine came in at +0.171R over 459 trades. Short intraday
    # horizons look like where the edge goes to die, so the burden of proof is
    # on re-adding it with a backtest, not on keeping it.
    #   python backtest.py --asset equity      # +0.171R
    #   python backtest.py --asset cf          # -0.029R
  workflow_dispatch:              # manual trigger from GitHub UI
    inputs:
      slot:
        description: 'Scan slot (blank = pick from the IST clock)'
        required: false
        default: ''
        type: choice
        options: ['', midday, eod, weekend, us, full, momentum]
      # THE ONCE-GUARD USED TO BE DROPPED BY THE ACT OF NAMING A SLOT.
      #
      # `if [ -n "$INPUT_SLOT" ]; then SLOT=...; ONCE=""; fi` read as "asking
      # by hand means run it", which is right for a human at the UI and wrong
      # for the pipeline watchdog, which names a slot on every dispatch. It
      # would have re-scanned a slot that had already completed and sent the
      # day's alerts a second time — the precise failure --once exists to stop.
      #
      # Forcing is now something you ASK for rather than something you get for
      # free by naming a slot.
      force:
        description: 'Re-run a slot that already completed today (drops --once)'
        required: false
        default: false
        type: boolean

concurrency:
  group: scanner
  cancel-in-progress: false       # never cancel — queue next run

env:
  TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
  UPSTOX_API_KEY:      ${{ secrets.UPSTOX_API_KEY }}
  UPSTOX_API_SECRET:   ${{ secrets.UPSTOX_API_SECRET }}
  # The long-lived Analytics Token. The OAuth pair above cannot work on an
  # ephemeral runner — its token is written to cache/, which is gitignored
  # and cached by nothing — so the scanner silently used Yahoo on every run.
  UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
  TURSO_URL:           ${{ secrets.TURSO_URL }}
  TURSO_TOKEN:         ${{ secrets.TURSO_TOKEN }}
  GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
  GH_PAT:              ${{ secrets.GH_PAT }}
  OBSIDIAN_GITHUB_REPO: ${{ secrets.OBSIDIAN_GITHUB_REPO }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install core dependencies
        run: |
          pip install --upgrade pip
          pip install "yfinance>=0.2.40" pandas numpy ta requests pytz requests-cache multitasking python-dotenv

      - name: Install DB + optional dependencies
        run: |
          pip install libsql-experimental || true   # required by tracker.py → db.py
          pip install groq feedparser apscheduler || true
          pip install upstox-python-sdk || true

      - name: Ensure data directory exists
        run: mkdir -p data logs cache

      # Gate the scan on the alert pipeline being intact. A silent regression
      # here does not fail the run — it just stops signals reaching Telegram
      # while the site keeps showing them as sent, which is how 2026-07-31 went
      # unnoticed. Stubbed network, throwaway DB, runs in about a second.
      - name: Verify alert pipeline
        run: python test_alert_pipeline.py

      # Slot comes from the cron that fired, not from the clock at run time.
      # Deriving it from the clock looked correct but wasn't: GitHub delays
      # scheduled runs by hours, not minutes (measured here — 06:15Z fired at
      # 09:17Z, 11:00Z at 12:48Z, Saturday 04:00Z at 06:27Z). Those land at
      # 14:47 and 18:18 IST, outside every _slot() window, so both weekday runs
      # on 2026-07-31 silently took the "full" fallback — which skips the
      # measured equity scan and the signal ledger.
      #
      # github.event.schedule holds the cron expression for scheduled runs and
      # is empty for workflow_dispatch, so manual runs keep using the clock.
      - name: Run scanner
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_SLOT: ${{ github.event.inputs.slot }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          # These strings must match the `cron:` values above EXACTLY. They are
          # a second copy of the schedule, so moving a cron without moving its
          # arm here falls through to SLOT="" — which does not fail, it quietly
          # runs the clock-based fallback, i.e. the wrong scan or none at all.
          # --once goes on EVERY scheduled arm, primary and retry alike, and
          # that is the whole design. The failure is a DROPPED run, but drift
          # is real too: a "primary" delayed to 08:00 UTC would land after both
          # retries and scan the slot a second time. With --once the rule is
          # simply "one completed scan per slot per IST day" and whichever cron
          # arrives first does the work. There is no primary any more, only
          # four chances at the same job.
          # --once is now the default on EVERY path, dispatch included. See the
          # `force` input above for why naming a slot no longer drops it.
          ONCE="--once"
          case "$SCHEDULE" in
            "0 5 * * 1-5")  SLOT=midday  ;;
            "30 5 * * 1-5") SLOT=midday  ;;
            "0 6 * * 1-5")  SLOT=midday  ;;
            "0 13 * * 1-5") SLOT=eod     ;;
            "0 15 * * 1-5") SLOT=eod     ;;
            "0 17 * * 1-5") SLOT=eod     ;;
            "0 4 * * 6")    SLOT=weekend ;;
            *)              SLOT=""      ;;
          esac
          # An explicit dispatch input always wins over the cron table, but it
          # no longer implies "run it regardless" — only force:true does.
          if [ -n "$INPUT_SLOT" ]; then SLOT="$INPUT_SLOT"; fi
          if [ "${INPUT_FORCE:-false}" = "true" ]; then ONCE=""; echo "force: --once dropped"; fi
          echo "fired at $(date -u '+%H:%M UTC') / $(TZ=Asia/Kolkata date '+%H:%M IST')"
          if [ -n "$SLOT" ]; then
            echo "cron '$SCHEDULE' input '$INPUT_SLOT' → slot $SLOT $ONCE"
            python standalone_scan.py --slot "$SLOT" $ONCE
          else
            echo "no schedule match (manual run) → slot from IST clock"
            python standalone_scan.py
          fi

      - name: Commit signal data to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/
          git diff --staged --quiet || git commit -m "data: update signals $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          git push || echo "Push failed — likely no changes or conflict"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-logs-${{ github.run_id }}
          path: |
            logs/
            data/
          retention-days: 7
